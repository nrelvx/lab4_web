<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 2</title>
</head>
<body>
    <p align="center">
        <br><br><br><br>
        <marquee width="70%" height="80" bgColor="#f7d99b" behavior="alternate">
            <font color="#40351f" size="5">
                <br>
                HTML — основа структури веб-сторінки
            </font>
        </marquee>
        <br><br><br>
        
        <marquee width="70%" height="80" bgColor="#1273aa" behavior="scroll" direction="left">
            <font color="#b5e4ec" size="5">
                <br>
                Вивчення HTML допомагає створювати сучасні сайти
            </font>
        </marquee>
        <br><br><br>
        
        <marquee width="70%" height="80" bgColor="#513b23" behavior="slide" direction="right">
            <font color="#fde3b0" size="5">
                <br>
                Кожен тег HTML має своє призначення
            </font>
        </marquee>     
        <br><br><br>   

        <marquee width="70%" height="80" bgColor="#edf2c9" behavior="scroll" scrolldelay="40" direction="left" >
            <font color="#40351f" size="5">
                <br>
                Практика допомагає краще зрозуміти HTML
            </font>
        </marquee>     
        <br><br><br> 

        <marquee width="70%" height="80" bgColor="#eeeee4" behavior="scroll" scrolldelay="150" direction="left">
            <font color="#40351f" size="5">
                <br>
                Веб-розробка поєднує HTML, CSS та JavaScript
            </font>
        </marquee>     
    </p>
    
</body>
</html>
